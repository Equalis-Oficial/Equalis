services:
  mysql:
    image: mysql:8.0
    container_name: equalis_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: equalis_db
      MYSQL_USER: equalis
      MYSQL_PASSWORD: equalis123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./backend/database/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro

volumes:
  mysql_data:

